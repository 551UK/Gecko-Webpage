name: Build and Release Gecko-Webpage IPA
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    name: Build unsigned iOS IPA and publish GitHub Release
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Compile arm64 iOS Gecko runtime
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -x objective-c -fobjc-arc -fblocks -dynamiclib \
            -Wl,-install_name,@executable_path/Frameworks/GeckoKiosk.dylib \
            src/GeckoKiosk.m -framework Foundation -framework UIKit -lobjc -o GeckoKiosk.dylib
          file GeckoKiosk.dylib
      - name: Download pinned Reynard 0.19.0 jailbroken IPA
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 4 \
            https://github.com/minh-ton/reynard-browser/releases/download/0.19.0/Reynard-Jailbroken.ipa \
            -o Reynard-Jailbroken.ipa
          echo '85898f009c8920ed8a01f8478ef893c4704585a271b4d96c3688a4aa0cc21481  Reynard-Jailbroken.ipa' | shasum -a 256 --check
      - name: Prepare Python and Pillow
        run: |
          set -euxo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install 'Pillow>=10,<13'
      - name: Build four standalone Gecko-Webpage IPAs
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          for i in 1 2 3 4; do
            python src/build_gecko_kiosk.py \
              --ipa Reynard-Jailbroken.ipa \
              --dylib GeckoKiosk.dylib \
              --url https://google.com \
              --name "Gecko WebApp $i" \
              --id "kiosk$i" \
              --output "Gecko-Webpage-$i.ipa"
          done
      - name: Verify all four apps have different bundle IDs
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import plistlib, zipfile
          bundle_ids=[]
          for i in range(1,5):
              ipa=f'Gecko-Webpage-{i}.ipa'
              root='Payload/Reynard.app/'
              with zipfile.ZipFile(ipa) as z:
                  assert z.testzip() is None, f'Corrupted {ipa}'
                  files=set(z.namelist())
                  for suffix in ('Frameworks/GeckoKiosk.dylib','GeckoSite.json','Reynard',
                                 'PlugIns/Reynard Helper.appex/Reynard Helper','PlugIns/OpenIn.appex/OpenIn'):
                      assert root+suffix in files, f'{ipa}: {suffix} missing'
                  info=plistlib.loads(z.read(root+'Info.plist'))
                  expected=f'com.551uk.gwa.kiosk{i}'
                  assert info['CFBundleIdentifier']==expected, (ipa,info['CFBundleIdentifier'])
                  assert info['CFBundleDisplayName']==f'Gecko WebApp {i}'
                  assert [a['UIApplicationShortcutItemTitle'] for a in info['UIApplicationShortcutItems']] == [
                      'Change Website','Start New Session'
                  ]
                  for extension in ('PlugIns/Reynard Helper.appex','PlugIns/OpenIn.appex'):
                      ext=plistlib.loads(z.read(root+extension+'/Info.plist'))
                      assert ext['CFBundleIdentifier'].startswith(expected+'.'), (ipa,extension,ext['CFBundleIdentifier'])
                  assert len(files)>2500, f'{ipa}: missing Gecko resources'
                  bundle_ids.append(info['CFBundleIdentifier'])
              print('Verified',ipa,expected)
          assert len(set(bundle_ids))==4
          PY
          ls -lh Gecko-Webpage-{1,2,3,4}.ipa
          shasum -a 256 Gecko-Webpage-{1,2,3,4}.ipa
      - name: Remove superseded single IPA and obsolete kit from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for asset in 'Gecko-Webpage-v0.1.0-TrollStore-UNSIGNED.ipa' 'Gecko-Webpage-v0.1.0-Clone-Kit.zip'; do
            if gh release view v0.1.0 >/dev/null 2>&1 &&
               gh release view v0.1.0 --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release delete-asset v0.1.0 "$asset" --yes
            fi
          done
      - name: Publish four IPA instances to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Gecko-Webpage v0.1.0 (Experimental)
          body_path: RELEASE_NOTES.md
          draft: false
          fail_on_unmatched_files: true
          files: |
            Gecko-Webpage-1.ipa
            Gecko-Webpage-2.ipa
            Gecko-Webpage-3.ipa
            Gecko-Webpage-4.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gecko-Webpage-Four-IPAs
          path: |
            Gecko-Webpage-1.ipa
            Gecko-Webpage-2.ipa
            Gecko-Webpage-3.ipa
            Gecko-Webpage-4.ipa
          if-no-files-found: ignore
          retention-days: 14
